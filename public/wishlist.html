<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist | BassBox Enclosures</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <section class="page-head"><div class="container"><div class="breadcrumb"><a href="/">Home</a> / Wishlist</div><h1 style="font-size:2.2rem;margin:0">My Wishlist</h1></div></section>

  <main class="section"><div class="container"><div class="product-grid" id="grid"></div></div></main>

  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script>
    App.ready.then(async (App) => {
      const all = await App.api('/api/products');
      const render = () => {
        const ids = App.wishlist.ids();
        const items = all.filter((p) => ids.includes(p.id));
        App.$('#grid').innerHTML = items.length ? items.map(App.productCard).join('')
          : `<div class="empty" style="grid-column:1/-1"><h2>Your wishlist is empty</h2><p>Tap the ♡ on any product to save it here.</p><a class="btn" href="/shop.html">Browse boxes</a></div>`;
      };
      document.addEventListener('wishlist:change', render);
      render();
    });
  </script>
</body>
</html>
