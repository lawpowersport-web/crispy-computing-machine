<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | BassBox Enclosures</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <section class="page-head"><div class="container"><div class="breadcrumb"><a href="/">Home</a> / Cart</div><h1 style="font-size:2.2rem;margin:0">Shopping Cart</h1></div></section>

  <main class="container">
    <div class="cart-layout" id="cart-root"></div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script>
    App.ready.then((App) => {
      const { $, $$, esc, api, store } = App;

      async function render() {
        const items = App.cart.items();
        if (!items.length) {
          $('#cart-root').style.display = 'block';
          $('#cart-root').innerHTML = `<div class="empty"><h2>Your cart is empty</h2><p>Find the perfect box for your truck.</p><a class="btn" href="/shop.html">Start shopping</a></div>`;
          return;
        }
        let q, err = '';
        const coupon = store.get('bb_coupon', '');
        try { q = await api('/api/cart/quote', { method: 'POST', body: { items: App.cart.payload(), coupon: App.on('coupons') ? coupon : '' } }); }
        catch (e) {
          err = e.message;
          if (coupon) { store.set('bb_coupon', ''); try { q = await api('/api/cart/quote', { method: 'POST', body: { items: App.cart.payload() } }); } catch (e2) { err = e2.message; } }
        }
        // keep stored unit prices in sync with the server
        if (q) { const its = App.cart.items(); its.forEach((it, i) => (it.unitPrice = q.lines[i]?.unitPrice ?? it.unitPrice)); store.set('bb_cart', its); }

        const free = App.config.store.freeShippingOver;
        $('#cart-root').innerHTML = `
          <div>
            ${err ? `<div class="alert alert-error">${esc(err)}</div>` : ''}
            <table class="cart-table"><thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th></tr></thead><tbody>
            ${items.map((i) => `<tr>
              <td><div class="cart-item"><img src="${esc(i.image)}" alt=""><div><a href="/product.html?p=${encodeURIComponent(i.slug)}"><strong>${esc(i.name)}</strong></a><div class="opts">${esc(App.optionText(i.options))}</div><button class="remove-btn" data-rm="${esc(i.key)}">Remove</button></div></div></td>
              <td>${App.money(i.unitPrice)}</td>
              <td><div class="qty"><button data-dec="${esc(i.key)}" aria-label="Decrease">−</button><input value="${i.qty}" data-q="${esc(i.key)}" type="number" min="1" max="20" aria-label="Quantity"><button data-inc="${esc(i.key)}" aria-label="Increase">+</button></div></td>
              <td><strong>${App.money(i.unitPrice * i.qty)}</strong></td></tr>`).join('')}
            </tbody></table>
            <div style="display:flex;justify-content:space-between;margin-top:20px;gap:10px;flex-wrap:wrap"><a href="/shop.html" class="btn btn-outline btn-sm">← Continue shopping</a><button class="btn btn-outline btn-sm" id="clear">Clear cart</button></div>
          </div>
          <aside class="summary">
            <h3>Order summary</h3>
            ${q ? `
            ${free ? `<div style="font-size:.88rem">${q.subtotal - q.discount >= free ? '🎉 You qualify for free shipping!' : `Add <strong>${App.money(free - q.subtotal + q.discount)}</strong> for free shipping`}</div><div class="free-ship-bar"><span style="width:${Math.min(100, ((q.subtotal - q.discount) / free) * 100)}%"></span></div>` : ''}
            <div class="summary-row"><span>Subtotal</span><span>${App.money(q.subtotal)}</span></div>
            ${q.discount ? `<div class="summary-row" style="color:var(--success)"><span>Discount (${esc(q.coupon)}) <button class="remove-btn" id="rm-coupon">remove</button></span><span>−${App.money(q.discount)}</span></div>` : ''}
            <div class="summary-row"><span>Shipping</span><span>${q.shipping ? App.money(q.shipping) : 'FREE'}</span></div>
            <div class="summary-row muted" style="font-size:.85rem"><span>Tax</span><span>Calculated at checkout</span></div>
            <div class="summary-row total"><span>Total</span><span>${App.money(q.subtotal - q.discount + q.shipping)}</span></div>` : ''}
            ${App.on('coupons') ? `<form class="coupon-row" id="coupon-form"><input name="code" placeholder="Coupon code" aria-label="Coupon code"><button class="btn btn-dark btn-sm">Apply</button></form>` : ''}
            <a href="/checkout.html" class="btn btn-block ${q ? '' : 'hidden'}">Proceed to checkout</a>
            <p class="muted center" style="font-size:.82rem;margin-top:10px">🔒 Secure checkout</p>
          </aside>`;
        $$('[data-rm]').forEach((b) => (b.onclick = () => App.cart.remove(b.dataset.rm)));
        $$('[data-dec]').forEach((b) => (b.onclick = () => App.cart.setQty(b.dataset.dec, App.cart.items().find((x) => x.key === b.dataset.dec).qty - 1)));
        $$('[data-inc]').forEach((b) => (b.onclick = () => App.cart.setQty(b.dataset.inc, App.cart.items().find((x) => x.key === b.dataset.inc).qty + 1)));
        $$('[data-q]').forEach((inp) => (inp.onchange = () => App.cart.setQty(inp.dataset.q, +inp.value || 1)));
        $('#clear').onclick = () => confirm('Remove all items?') && App.cart.clear();
        $('#rm-coupon') && ($('#rm-coupon').onclick = () => { store.set('bb_coupon', ''); render(); });
        $('#coupon-form')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          try { await api('/api/coupons/validate', { method: 'POST', body: { code: e.target.code.value } }); store.set('bb_coupon', e.target.code.value.trim()); App.toast('Coupon applied'); render(); }
          catch (er) { App.toast(er.message); }
        });
      }
      document.addEventListener('cart:change', render);
      render();
    });
  </script>
</body>
</html>
