<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Your Order | BassBox Enclosures</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <section class="page-head"><div class="container"><div class="breadcrumb"><a href="/">Home</a> / Track Your Order</div><h1 style="font-size:2.2rem;margin:0">Track Your Order</h1></div></section>

  <main class="section"><div class="container" style="max-width:720px">
    <form id="track-form" class="checkout-section"><div class="form-grid">
      <div><label for="id">Order number</label><input id="id" name="id" placeholder="BB10001" required></div>
      <div><label for="email">Email used at checkout</label><input id="email" name="email" type="email" required></div>
    </div><button class="btn" style="margin-top:14px">Track order</button></form>
    <div id="result"></div>
  </div></main>

  <div id="site-footer"></div>
  <script src="/js/app.js"></script>
  <script>
    App.ready.then((App) => {
      const { $, esc, api } = App;
      const form = $('#track-form');
      const p = new URLSearchParams(location.search);
      form.id.value = p.get('id') || ''; form.email.value = p.get('email') || '';
      async function track() {
        try {
          const o = await api(`/api/orders/track?id=${encodeURIComponent(form.id.value)}&email=${encodeURIComponent(form.email.value)}`);
          $('#result').innerHTML = `<div class="checkout-section"><h3>Order ${esc(o.id)} <span class="status-pill">${esc(o.status)}</span></h3>
            <p class="muted">Placed ${new Date(o.createdAt).toLocaleString()} • Total ${App.money(o.total)}</p>
            ${o.tracking ? `<p><strong>Tracking number:</strong> ${esc(o.tracking)}</p>` : ''}
            ${o.items.map((i) => `<div class="mini-line"><div class="grow"><strong>${esc(i.name)}</strong><div class="muted" style="font-size:.8rem">${esc(Object.values(i.options).join(' • '))}</div></div>${i.qty} × ${App.money(i.unitPrice)}</div>`).join('')}
            <ul class="timeline">${o.history.slice().reverse().map((h) => `<li><strong style="text-transform:capitalize">${esc(h.status)}</strong><br><small class="muted">${new Date(h.at).toLocaleString()}${h.note ? ' — ' + esc(h.note) : ''}</small></li>`).join('')}</ul></div>`;
        } catch (e) { $('#result').innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`; }
      }
      form.addEventListener('submit', (e) => { e.preventDefault(); track(); });
      if (form.id.value && form.email.value) track();
    });
  </script>
</body>
</html>
