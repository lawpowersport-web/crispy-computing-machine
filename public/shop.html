<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Subwoofer Enclosures | BassBox Enclosures</title>
  <meta name="description" content="Shop vehicle-specific underseat, universal and ported subwoofer enclosures.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="/">Home</a> / <span id="crumb">Shop</span></div>
      <h1 id="page-title" style="font-size:2.2rem;margin:0">All Enclosures</h1>
    </div>
  </section>

  <main class="section">
    <div class="container shop-layout">
      <aside class="filters" id="filters">
        <form class="filter-group" id="veh-filter">
          <h4>🚙 Your vehicle</h4>
          <div style="display:flex;flex-direction:column;gap:8px">
            <select name="year" aria-label="Year"></select>
            <select name="make" aria-label="Make"></select>
            <select name="model" aria-label="Model"></select>
            <button class="btn btn-sm">Apply</button>
            <button type="button" class="btn btn-sm btn-outline" id="clear-veh">Clear vehicle</button>
          </div>
        </form>
        <div class="filter-group"><h4>Category</h4><div class="opts" id="f-cat"></div></div>
        <div class="filter-group"><h4>Subwoofer size</h4><div class="opts" id="f-sub">
          <label><input type="radio" name="sub" value=""> Any</label>
          <label><input type="radio" name="sub" value="8"> 8"</label>
          <label><input type="radio" name="sub" value="10"> 10"</label>
          <label><input type="radio" name="sub" value="12"> 12"</label>
        </div></div>
        <div class="filter-group"><h4>Max price</h4>
          <input type="range" min="50" max="500" step="10" id="f-price" aria-label="Max price">
          <div class="muted" id="f-price-label"></div>
        </div>
      </aside>

      <section>
        <div class="shop-toolbar">
          <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
          <div style="display:flex;gap:10px;align-items:center">
            <span class="muted" id="count"></span>
            <select id="sort" aria-label="Sort">
              <option value="">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="rating">Top rated</option>
              <option value="newest">Newest</option>
            </select>
          </div>
        </div>
        <div class="product-grid" id="grid"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/app.js"></script>
  <script>
    App.ready.then((App) => {
      const { $, $$, esc, api } = App;
      const params = new URLSearchParams(location.search);
      const setParam = (k, v) => { v ? params.set(k, v) : params.delete(k); history.replaceState(null, '', '?' + params); load(); };

      // vehicle filter (fitment-finder plugin)
      const vf = $('#veh-filter');
      if (App.on('fitment-finder')) {
        if (!params.get('make') && App.vehicle.get() && !params.get('q') && !params.get('category')) {
          const v = App.vehicle.get();
          params.set('year', v.year); params.set('make', v.make); params.set('model', v.model);
        }
        App.mountFinder(vf, (v) => { params.set('year', v.year); params.set('make', v.make); params.set('model', v.model); history.replaceState(null, '', '?' + params); load(); });
        $('#clear-veh').onclick = () => { App.vehicle.clear(); ['year', 'make', 'model'].forEach((k) => params.delete(k)); vf.reset(); history.replaceState(null, '', '?' + params); load(); };
      } else vf.remove();

      $('#f-cat').innerHTML = `<label><input type="radio" name="cat" value=""> All</label>` +
        App.config.categories.map((c) => `<label><input type="radio" name="cat" value="${c.id}"> ${esc(c.name)}</label>`).join('');
      $$('[name=cat]').forEach((r) => { r.checked = r.value === (params.get('category') || ''); r.onchange = () => setParam('category', r.value); });
      $$('[name=sub]').forEach((r) => { r.checked = r.value === (params.get('sub') || ''); r.onchange = () => setParam('sub', r.value); });
      const pr = $('#f-price');
      pr.value = params.get('maxPrice') || 500;
      const plabel = () => ($('#f-price-label').textContent = pr.value >= 500 ? 'Any price' : 'Up to ' + App.money(pr.value));
      plabel();
      pr.oninput = plabel;
      pr.onchange = () => setParam('maxPrice', pr.value >= 500 ? '' : pr.value);
      $('#sort').value = params.get('sort') || '';
      $('#sort').onchange = (e) => setParam('sort', e.target.value);

      async function load() {
        const list = await api('/api/products?' + params);
        const cat = App.config.categories.find((c) => c.id === params.get('category'));
        const veh = params.get('make') ? `${params.get('year') || ''} ${params.get('make')} ${params.get('model') || ''}`.trim() : '';
        const title = params.get('q') ? `Search: “${params.get('q')}”` : veh ? `Boxes for ${veh}` : cat ? cat.name : 'All Enclosures';
        $('#page-title').textContent = title; $('#crumb').textContent = title; document.title = title + ' | ' + App.config.store.name;
        $('#count').textContent = `${list.length} product${list.length === 1 ? '' : 's'}`;
        const chips = [['q', params.get('q')], ['vehicle', veh], ['category', cat?.name], ['sub', params.get('sub') && params.get('sub') + '" subs'], ['maxPrice', params.get('maxPrice') && 'Under ' + App.money(params.get('maxPrice'))]].filter(([, v]) => v);
        $('#chips').innerHTML = chips.map(([k, v]) => `<span class="chip">${esc(v)} <button data-k="${k}" aria-label="Remove filter">✕</button></span>`).join('');
        $$('#chips button').forEach((b) => (b.onclick = () => {
          if (b.dataset.k === 'vehicle') { App.vehicle.clear(); ['year', 'make', 'model'].forEach((k) => params.delete(k)); }
          else params.delete(b.dataset.k);
          history.replaceState(null, '', '?' + params); load();
        }));
        $('#grid').innerHTML = list.length ? list.map(App.productCard).join('')
          : `<div class="empty" style="grid-column:1/-1"><h3>No boxes match those filters</h3><p>Don't see your vehicle? We build custom enclosures too.</p><a class="btn" href="/custom.html">Request a custom box</a></div>`;
      }
      load();
    });
  </script>
</body>
</html>
